# Atualizações de versão uma vez por mês. As de segurança não seguem este calendário nem o cooldown: o Dependabot
# abre o PR assim que sai o alerta (alertas e correções automáticas ligados nas configurações do repositório).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham o Node do runtime (.nvmrc = 24); a major sobe junto com o .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # init e analyze precisam da mesma versão; separados, o CodeQL falha (#34 e #36).
      codeql-action:
        patterns: ['github/codeql-action/*']
      codeql-action-security:
        applies-to: security-updates
        patterns: ['github/codeql-action/*']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # A major do Postgres local acompanha a do banco de produção, decidida com a hospedagem (CHECKLIST_GO_LIVE 2.1).
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
