# CI: lint, typecheck, testes, build, e2e, papéis do banco, auditoria de dependências, SAST e segredos.
# Requisitos: LEG-S09 (varredura de dependências e SAST), LEG-X01, §41 (performance), LEG-M03, LEG-S03, LEG-S04, LEG-F01.
# Actions fixadas por SHA (supply chain); o Dependabot propõe as atualizações.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'
  APP_ENV: test

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Inclui o teste de strings proibidas (LEG-M03) e o de contraste dos tokens (LEG-X01).
      - run: pnpm test
      # Política de retenção do .env.example e do backup declarado em infra/retention.json (ADR-0035, LEG-S07).
      - run: pnpm check:retention
      # Regiões declaradas em infra/regions.json: tudo no Brasil, inclusive funções, worker e logs (ADR-0036 D1,
      # ADR-0040, LEG-S10); serviço fora do Brasil só sem dado de saúde e listado em SUBPROCESSORS.md.
      - run: pnpm check:infra
      - run: pnpm build
      # Orçamento de performance (§41, ADR-0039): JS de entrada por rota, maior chunk e .glb dentro dos tetos de
      # perf-budget.json; falha se o three.js entrar no dashboard (3D sob demanda, ADR-0026).
      - run: pnpm check:perf-budget

  e2e:
    # Dividido em 2 partes (shards), cada uma com banco e servidor próprios: o job inteiro chegou a 9m54s.
    name: E2E e acessibilidade (Playwright + axe) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env efêmero com senhas aleatórias
        run: sh scripts/ci-make-env.sh
      - run: docker compose up -d --wait db
      - run: pnpm exec prisma generate
      - run: pnpm db:deploy
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Inclui cadastro, menor sem linha no banco, revogação de sessão e CSP (LEG-S04, LEG-F01, LEG-S05).
      - run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/2
      - if: always()
        run: docker compose down -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  perf:
    # §41 (7d, ADR-0039): dashboard interativo em até 2,5 s no build de produção, com 4G lenta e CPU 4×.
    name: Performance do dashboard (4G, CPU 4×)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env efêmero com senhas aleatórias
        run: sh scripts/ci-make-env.sh
      - run: docker compose up -d --wait db
      - run: pnpm exec prisma generate
      - run: pnpm db:deploy
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:perf
      - if: always()
        run: docker compose down -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-perf
          path: playwright-report/
          retention-days: 7

  db:
    name: Banco (papéis, RLS, auth com Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env efêmero com senhas aleatórias
        run: sh scripts/ci-make-env.sh
      - run: docker compose up -d --wait db
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm db:deploy
      # Papéis, RLS em toda tabela, funções SECURITY DEFINER com search_path fixo (LEG-S03, ADR-0015).
      - run: pnpm db:verify-roles
      # Isolamento entre usuários, consulta sem contexto, revogação, menor sem linha, enumeração,
      # bloqueio por tentativas, reset, TOTP/recuperação e logs sem dado sensível. Inclui o ensaio de backup
      # cifrado e restauração isolada com reaplicação (pg_dump/pg_restore no contêiner; LEG-S07, P7-M3).
      - run: pnpm test:db
      - if: always()
        run: docker compose down -v

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Fixada por digest (P7-B7). O Dependabot não lê imagens de `container:` nem de `docker run`: atualizar à
      # mão junto com a tag (docker buildx imagetools inspect <imagem>:<tag>).
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Regras públicas da comunidade; sem login e sem envio de métricas.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/react --config p/nextjs
          --config p/secrets --config p/owasp-top-ten

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
