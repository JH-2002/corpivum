# CI: lint, typecheck, testes, build, e2e, papéis do banco, auditoria de dependências, SAST e segredos.
# Requisitos: LEG-S09 (varredura de dependências e SAST), LEG-X01, LEG-M03, LEG-S03, LEG-S04, LEG-F01.
# Actions fixadas por SHA (supply chain); o Dependabot propõe as atualizações.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'
  APP_ENV: test

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Inclui o teste de strings proibidas (LEG-M03) e o de contraste dos tokens (LEG-X01).
      - run: pnpm test
      - run: pnpm build
      # JS de entrada por rota; falha se o three.js entrar no dashboard (3D sob demanda, ADR-0026).
      - run: node scripts/route-js.mjs "(app)/inicio" demo "(app)/twin" demo/twin

  e2e:
    name: E2E e acessibilidade (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env efêmero com senhas aleatórias
        run: sh scripts/ci-make-env.sh
      - run: docker compose up -d --wait db
      - run: pnpm exec prisma generate
      - run: pnpm db:deploy
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Inclui cadastro, menor sem linha no banco, revogação de sessão e CSP (LEG-S04, LEG-F01, LEG-S05).
      - run: pnpm test:e2e
      - if: always()
        run: docker compose down -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: Banco (papéis, RLS, auth com Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env efêmero com senhas aleatórias
        run: sh scripts/ci-make-env.sh
      - run: docker compose up -d --wait db
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm db:deploy
      # Papéis, RLS em toda tabela, funções SECURITY DEFINER com search_path fixo (LEG-S03, ADR-0015).
      - run: pnpm db:verify-roles
      # Isolamento entre usuários, consulta sem contexto, revogação, menor sem linha, enumeração,
      # bloqueio por tentativas, reset, TOTP/recuperação e logs sem dado sensível.
      - run: pnpm test:db
      - if: always()
        run: docker compose down -v

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Regras públicas da comunidade; sem login e sem envio de métricas.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/react --config p/nextjs
          --config p/secrets --config p/owasp-top-ten

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
