# SAST com CodeQL (LEG-S09).
# Repositório privado sem GitHub Code Security: o Code Scanning não aceita upload. Por isso a análise roda
# localmente no job (upload: never), o SARIF vira artefato e o job FALHA se houver qualquer achado
# (ADR-0013). Se o Code Security for habilitado, trocar para o upload padrão.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analisar JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
      - name: Falhar se houver achados
        run: node scripts/check-sarif.mjs codeql-results
