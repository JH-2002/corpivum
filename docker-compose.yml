# Ambiente de DESENVOLVIMENTO local. Apenas dados sintéticos (CLAUDE.md regra 6).
# Senhas vêm do arquivo .env (não versionado). Veja .env.example.
services:
  db:
    # Fixada por digest (P7-B7); o Dependabot (docker-compose) propõe as atualizações.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?defina POSTGRES_SUPERUSER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD no .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-healthmind}
      # Banco só para testes (ADR-0024), criado por docker/postgres/init/02-test-db.sh.
      APP_TEST_DB_NAME: ${APP_TEST_DB_NAME:-healthmind_test}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?defina APP_MIGRATOR_PASSWORD no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD no .env}
      # Atendimento manual de pedidos do titular (ADR-0034, ADR-0037: grupo app_operator e papel operador_dev), criado por docker/postgres/init/03-operator-role.sh.
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD:?defina APP_OPERATOR_PASSWORD no .env}
      # Jobs em segundo plano (ADR-0037), criado por docker/postgres/init/04-worker-role.sh.
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:?defina APP_WORKER_PASSWORD no .env}
      # Livro de reaplicação dos backups (ADR-0040), criado por docker/postgres/init/05-backup-role.sh.
      APP_BACKUP_PASSWORD: ${APP_BACKUP_PASSWORD:?defina APP_BACKUP_PASSWORD no .env}
      TZ: UTC
    ports:
      # Exposto só na máquina local.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  # Caixa de e-mail falsa para DESENVOLVIMENTO (ADR-0023): recebe por SMTP os e-mails que o app envia com
  # APP_ENV=development (verificação, redefinição) e mostra em http://localhost:8025. Nada sai da máquina.
  # Mensagens só em memória (sem volume): somem ao parar o contêiner.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 200
      TZ: America/Sao_Paulo
    ports:
      # Interface web e SMTP expostos só na máquina local.
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:${DEV_SMTP_PORT:-1025}:1025'

volumes:
  db-data:
